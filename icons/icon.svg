<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111c2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  
  <!-- Outer glowing orbital ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="800 280" filter="url(#glow)" opacity="0.8" />
  
  <!-- Mobility Human Silhouette / Dynamic Wave -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Head -->
    <circle cx="0" cy="-90" r="24" fill="url(#accentGrad)" />
    
    <!-- Fluid Spinal Curve (Dynamic Arc) -->
    <path d="M 0,-55 C 28,-25 35,15 0,55 C -35,95 20,130 35,145" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Flowing movement arcs -->
    <path d="M -60,-20 C -25,-40 25,-40 60,-20" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.9" />
    <path d="M -75,40 C -30,20 30,20 75,40" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" opacity="0.75" />
    
    <!-- Grounding Energy Arc -->
    <path d="M -90,110 C -40,90 40,90 90,110" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  </g>
  
  <!-- MR badge subtle text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" letter-spacing="4" text-anchor="middle">MR SOLUTIONS</text>
</svg>
